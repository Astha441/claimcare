services:
  - type: web
    name: claimcare
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: WA_PHONE_ID
        sync: false
      - key: WA_ACCESS_TOKEN
        sync: false
      - key: WA_API_VERSION
        sync: false
      - key: WA_TEMPLATE_NAME
        sync: false
      - key: WA_TEMPLATE_LANGUAGE
        value: en
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
