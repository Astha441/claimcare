services:
  - type: web
    name: claimcare
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: claimcare-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: WA_PHONE_ID
        sync: false
      - key: WA_ACCESS_TOKEN
        sync: false
      - key: WA_API_VERSION
        sync: false
      - key: WA_TEMPLATE_NAME
        sync: false
      - key: WA_TEMPLATE_LANGUAGE
        value: en
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
