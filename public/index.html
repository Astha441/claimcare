<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClaimCare · Patient locker</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');:root{--ink:#19271f;--muted:#78867d;--line:#e4e9e4;--wash:#f4f6f3;--green:#176c51;--mint:#e6f2eb;--amber:#986013;--amberbg:#fff1d9;--red:#a6463f;--redbg:#fbe9e7;--shadow:0 8px 28px #1d32230a}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:14px 'DM Sans',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{background:white;border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:27px}.brand{display:flex;align-items:center;gap:10px;padding:0 9px;font:800 18px Manrope}.mark{width:34px;height:34px;border-radius:11px;background:var(--green);color:white;display:grid;place-items:center}.navtitle{padding:0 10px 8px;text-transform:uppercase;letter-spacing:.12em;color:#9aa69e;font-size:10px;font-weight:700}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:8px;color:#65746a;font-weight:600;display:flex;gap:12px}.nav button.active{background:var(--mint);color:var(--green)}.ic{width:18px;text-align:center}.sidebottom{margin-top:auto}.privacy{background:#f5f8f5;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:10px;color:#66756a;line-height:1.5}.privacy b{display:block;color:var(--ink);margin-bottom:4px}.main{min-width:0}.top{height:63px;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 30px;position:sticky;top:0;z-index:4}.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--ink)}.btn{border:1px solid var(--line);background:white;padding:8px 12px;border-radius:8px;color:var(--ink);font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:7px;justify-content:center}.btn:hover{border-color:#a9b8ad}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.small{padding:6px 8px;font-size:10px}.content{max-width:1400px;margin:auto;padding:27px 30px 55px}.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:var(--green);font-size:10px;font-weight:700}.head h1{font:700 25px Manrope;letter-spacing:-.04em;margin:6px 0 4px}.head p{margin:0;color:var(--muted);font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:15px}.metric,.card{background:white;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.metric{padding:14px 16px}.metric label{font-size:10px;color:var(--muted);font-weight:600}.metric strong{display:block;font:700 23px Manrope;margin:6px 0 2px}.metric small{font-size:10px;color:var(--muted)}.split{display:grid;grid-template-columns:minmax(370px,.9fr) minmax(400px,1.1fr);gap:14px;align-items:start}.cardhead{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.cardhead h2{font:700 13px Manrope;margin:0}.cardhead p{font-size:10px;color:var(--muted);margin:4px 0 0}.search{padding:10px 13px;border-bottom:1px solid var(--line);display:flex;gap:7px}.search input{flex:1;min-width:80px;border:1px solid var(--line);border-radius:8px;padding:8px 9px;font-size:11px}.search select{border:1px solid var(--line);border-radius:8px;padding:7px;font-size:10px;background:#fff}.list{max-height:590px;overflow:auto}.person{padding:12px 14px;border-bottom:1px solid #eff2ef;display:flex;gap:9px;align-items:center;cursor:pointer}.person:hover{background:#fafcfa}.person.selected{background:#f0f7f2;box-shadow:inset 3px 0 var(--green)}.avatar{width:35px;height:35px;border-radius:10px;background:var(--mint);color:var(--green);display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}.grow{flex:1;min-width:0}.pname{font-size:11px;font-weight:700}.psub{font-size:9px;color:var(--muted);margin-top:4px}.right{text-align:right}.count{font-size:9px;color:var(--muted);margin-top:4px}.status{font-size:9px;font-weight:700;border-radius:16px;padding:5px 7px;white-space:nowrap;background:var(--amberbg);color:var(--amber)}.status.ok{color:var(--green);background:var(--mint)}.profile{padding:16px 18px;display:flex;gap:12px;align-items:center}.profile .avatar{width:46px;height:46px;border-radius:13px;font-size:14px}.profile h2{font:700 15px Manrope;margin:0}.profile p{font-size:10px;color:var(--muted);margin:4px 0 0}.profile .status{margin-left:auto}.contacts{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 18px 14px}.contacts label{display:block;color:var(--muted);font-size:9px;margin-bottom:4px}.contacts b{font-size:10px}.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 18px;gap:16px;overflow:auto}.tabs button{border:0;background:transparent;color:var(--muted);font-size:10px;padding:11px 0;border-bottom:2px solid transparent;white-space:nowrap}.tabs button.active{border-color:var(--green);color:var(--green);font-weight:700}.body{padding:13px 18px}.doc,.query,.message{padding:9px 0;border-bottom:1px solid #eff2ef;display:flex;gap:9px;align-items:center}.file{width:29px;height:32px;border-radius:6px;background:#f0f4f0;color:var(--green);display:grid;place-items:center;font-size:8px;font-weight:700;flex:none}.row{min-width:0;flex:1}.row b{font-size:10px;display:block}.row small{font-size:9px;color:var(--muted);display:block;margin-top:3px}.rowbuttons{display:flex;gap:4px}.empty{padding:22px 10px;color:var(--muted);font-size:11px;text-align:center}.point{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #f0f2f0;align-items:flex-start;font-size:10px;line-height:1.4}.point small{display:block;color:var(--muted);margin-top:3px}.banner{background:#edf5ef;border:1px solid #d9e8dc;padding:10px 12px;border-radius:9px;font-size:10px;line-height:1.5;color:#506452;margin-bottom:12px}.template{white-space:pre-wrap;font-size:10px;line-height:1.5;padding:11px;background:#f8faf8;border:1px solid var(--line);border-radius:8px;margin-top:8px}.channel{font-size:9px;border-radius:14px;padding:5px 8px;background:var(--mint);color:var(--green);display:inline-block;margin:4px 4px 0 0}.channel.fail{background:var(--redbg);color:var(--red)}.check{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #f0f2f0;font-size:10px}.overlay{position:fixed;inset:0;background:#17261f77;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.overlay.show{display:flex}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:white;border-radius:13px;box-shadow:0 22px 65px #0003}.modalhead,.modalfoot{padding:14px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modalhead h2{font:700 15px Manrope;margin:0}.modalbody{padding:17px;display:grid;gap:11px}.modalfoot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end;gap:8px}.field label{display:block;color:var(--muted);font-size:9px;margin-bottom:5px}.field input,.field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:11px;background:white}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.toast{position:fixed;bottom:20px;right:22px;z-index:40;background:#1e3227;color:white;border-radius:8px;padding:11px 14px;font-size:11px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top left,#e6f1e8,transparent 45%),var(--wash)}.loginbox{width:min(380px,100%);background:white;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}.loginbox h1{font:700 23px Manrope;margin:22px 0 5px}.loginbox p{font-size:11px;color:var(--muted);line-height:1.55}.loginbox .field{margin-bottom:10px}.loginbox .btn{width:100%;padding:10px}.msg{white-space:pre-wrap;font-size:10px;line-height:1.5;color:#536158;margin-top:7px}.queryline{padding:14px 18px;border-bottom:1px solid var(--line)}.queryline:last-child{border:0}.delivery{margin-top:6px}button:disabled{opacity:.5}@media(max-width:1000px){.layout{grid-template-columns:68px 1fr}.side{padding:21px 8px}.brand{padding:0 8px}.brand span,.navtitle,.navtext,.sidebottom{display:none}.nav button{justify-content:center;padding:11px 0}.ic{width:auto}.content{padding:22px 17px}.top{padding:0 17px}.split{grid-template-columns:1fr}.list{max-height:340px}}@media(max-width:650px){.layout{grid-template-columns:1fr}.side{position:fixed;bottom:0;left:0;right:0;height:58px;padding:4px 8px;z-index:10;border:0;border-top:1px solid var(--line)}.brand,.navtitle,.sidebottom{display:none}.nav{display:flex;justify-content:space-around}.nav button{display:grid;justify-items:center;gap:2px;padding:5px;font-size:8px}.navtext{display:block}.ic{font-size:15px}.main{grid-row:1}.top{height:52px;padding:0 12px}.top .indicator{display:none}.content{padding:18px 11px 72px}.head{align-items:flex-start}.head h1{font-size:21px}.head .btn{padding:7px;font-size:9px}.metrics{grid-template-columns:1fr 1fr;gap:7px}.metric{padding:11px}.metric strong{font-size:20px}.split{display:flex;flex-direction:column}.split>.card{width:100%}.two{grid-template-columns:1fr}}
</style></head><body><div id="root"></div><div class="toast" id="toast"></div><div class="overlay" id="overlay"><section class="modal"><div class="modalhead"><h2 id="mtitle"></h2><button class="btn small" onclick="closeModal()">×</button></div><div class="modalbody" id="mbody"></div><div class="modalfoot" id="mfoot"></div></section></div><script>
const TYPES=['KYC','Policy copy / health card','Discharge summary','Final hospital bill','Investigation reports','Consultation papers','Pharmacy bills','Cancelled cheque','Other'];let S={patients:[],metrics:{},integrations:{},page:'patients',selected:'',tab:'documents',search:'',filter:'All'};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),ini=n=>String(n||'?').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opt.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401)showLogin();throw Error(d.error||'Request failed')}return d}function showLogin(){document.body.innerHTML=`<div class="login"><form class="loginbox" id="login"><div class="brand"><div class="mark">✚</div>claimcare</div><h1>Good to see you.</h1><p>Sign in to the claims operations workspace.</p><div class="field"><label>Workspace password</label><input id="password" type="password" required autofocus></div><button class="btn primary">Sign in</button><div id="err" style="color:var(--red);font-size:10px;margin-top:8px"></div></form></div>`;$('#login').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});location.reload()}catch(x){$('#err').textContent=x.message}}}async function init(){try{await refresh()}catch(e){if(e.message==='Sign in to continue.')showLogin();else document.body.innerHTML=`<div class="login"><div class="loginbox"><div class="brand"><div class="mark">✚</div>claimcare</div><h1>Server unavailable</h1><p>${esc(e.message)} Start the app server, then reload.</p></div></div>`}}async function refresh(){let d=await api('/api/boot');S.patients=d.patients;S.metrics=d.metrics;S.integrations=d.integrations;if(!S.patients.some(p=>p.id===S.selected))S.selected=S.patients[0]?.id||'';render()}function pnow(){return S.patients.find(p=>p.id===S.selected)}function openModal(t,b,f){$('#mtitle').textContent=t;$('#mbody').innerHTML=b;$('#mfoot').innerHTML=f;$('#overlay').classList.add('show')}function closeModal(){$('#overlay').classList.remove('show')}function st(p){if(p.queries.some(q=>!['Sent','Closed'].includes(q.status)))return ['Patient action',''];return p.messages.some(m=>m.status==='Sent')?['Message sent','ok']:['In review','ok']}function render(){let pages={patients:'Patient lockers',queries:'Query queue',messages:'Message history',settings:'Delivery status'};$('#root').innerHTML=`<div class="layout"><aside class="side"><div class="brand"><div class="mark">✚</div><span>claimcare</span></div><div><div class="navtitle">Workspace</div><nav class="nav"><button data-page="patients" class="${S.page==='patients'?'active':''}"><span class="ic">▦</span><span class="navtext">Patient lockers</span></button><button data-page="queries" class="${S.page==='queries'?'active':''}"><span class="ic">↗</span><span class="navtext">Query queue</span></button><button data-page="messages" class="${S.page==='messages'?'active':''}"><span class="ic">◷</span><span class="navtext">Message history</span></button></nav></div><div><div class="navtitle">Manage</div><nav class="nav"><button data-page="settings" class="${S.page==='settings'?'active':''}"><span class="ic">⚙</span><span class="navtext">Delivery status</span></button></nav></div><div class="sidebottom"><div class="privacy"><b>◉ &nbsp;Private workspace</b>Authenticated local workspace. Store only demo data here.</div></div></aside><main class="main"><header class="top"><div class="crumb">Claims operations&nbsp; / &nbsp;<b>${pages[S.page]}</b></div><div><span class="indicator">${S.integrations.whatsapp?'WhatsApp ready':'WhatsApp setup needed'} · ${S.integrations.email?'Email ready':'Email setup needed'}</span> <button class="btn small" id="logout">Log out</button></div></header><div class="content">${S.page==='patients'?patientPage():S.page==='queries'?queryPage():S.page==='messages'?messagePage():settingsPage()}</div></main></div>`;bind()}
function metrics(){return `<div class="metrics"><div class="metric"><label>Patient lockers</label><strong>${S.metrics.patients}</strong><small>Active profiles</small></div><div class="metric"><label>Documents stored</label><strong>${S.metrics.documents}</strong><small>In patient lockers</small></div><div class="metric"><label>Open insurer queries</label><strong>${S.metrics.queries}</strong><small>Patient follow-up needed</small></div><div class="metric"><label>Outbound messages</label><strong>${S.metrics.messages}</strong><small>Attempts recorded</small></div></div>`}function patientPage(){let arr=S.patients.filter(p=>(!S.search||`${p.name} ${p.id} ${p.phone}`.toLowerCase().includes(S.search.toLowerCase()))&&(S.filter==='All'||st(p)[0]===S.filter));return `<div class="head"><div><span class="eyebrow">Claims workspace</span><h1>Patient lockers</h1><p>Patient records, insurer queries and follow-up in one place.</p></div><button class="btn primary" id="new">＋ New patient</button></div>${metrics()}<div class="split"><section class="card"><div class="cardhead"><div><h2>All patients</h2><p>${S.patients.length} profiles</p></div><button class="btn small" id="export">↓ Export</button></div><div class="search"><input id="search" value="${esc(S.search)}" placeholder="Search name, ID, phone…"><select id="filter"><option>All</option><option ${S.filter==='Patient action'?'selected':''}>Patient action</option><option ${S.filter==='Message sent'?'selected':''}>Message sent</option><option ${S.filter==='In review'?'selected':''}>In review</option></select></div><div class="list">${arr.length?arr.map(p=>`<div class="person ${p.id===S.selected?'selected':''}" data-pid="${esc(p.id)}"><div class="avatar">${ini(p.name)}</div><div class="grow"><div class="pname">${esc(p.name)}</div><div class="psub">${esc(p.id)} · ${esc(p.city)}</div></div><div class="right"><span class="status ${st(p)[1]}">${st(p)[0]}</span><div class="count">${p.documents.length} documents</div></div></div>`).join(''):'<div class="empty">No matching patients.</div>'}</div></section><div>${detail()}</div></div>`}function detail(){let p=pnow();if(!p)return '<section class="card"><div class="empty">Choose or create a patient.</div></section>';let data=S.tab==='documents'?docs(p):S.tab==='queries'?queries(p):S.tab==='messages'?msgs(p):checklist(p);return `<section class="card"><div class="profile"><div class="avatar">${ini(p.name)}</div><div><h2>${esc(p.name)}</h2><p>${esc(p.id)} · ${esc(p.age)} yrs · ${esc(p.city)}</p></div><span class="status ${st(p)[1]}">${st(p)[0]}</span></div><div class="contacts"><div><label>PHONE</label><b>${esc(p.phone)}</b></div><div><label>EMAIL</label><b>${esc(p.email)}</b></div><div><label>CLAIM</label><b>${esc(p.claim)}</b></div><div><label>INSURER</label><b>${esc(p.insurer)}</b></div></div><div style="padding:0 18px 12px"><button class="btn small" id="editpatient">Edit contact details</button></div><div class="tabs"><button data-tab="documents" class="${S.tab==='documents'?'active':''}">Documents (${p.documents.length})</button><button data-tab="queries" class="${S.tab==='queries'?'active':''}">Queries (${p.queries.length})</button><button data-tab="messages" class="${S.tab==='messages'?'active':''}">Messages (${p.messages.length})</button><button data-tab="checklist" class="${S.tab==='checklist'?'active':''}">Checklist</button></div><div class="body">${data}</div></section>`}function docs(p){return `${p.documents.length?p.documents.map(d=>`<div class="doc"><div class="file">${d.mime?.includes('pdf')?'PDF':'DOC'}</div><div class="row"><b>${esc(d.name)}</b><small>${esc(d.category)} · ${new Date(d.date).toLocaleDateString()} · ${Math.ceil((d.size||0)/1024)} KB</small>${d.needsReview?`<small style="color:var(--red)">⚠ ${esc(d.reviewReason)}</small>`:''}</div><div class="rowbuttons"><a class="btn small" href="/api/files/${encodeURIComponent(d.file)}" target="_blank">↓</a><button class="btn small" data-del="${esc(d.id)}">×</button></div></div>`).join(''):'<div class="empty">No documents stored.</div>'}<button class="btn small" id="adddoc" style="margin-top:9px">＋ Add document</button>`}function pts(q){return `<div>${(q.points||[]).map(x=>`<div class="point"><span style="color:${x.have?'var(--green)':'var(--amber)'}">${x.have?'✓':'!'}</span><div>${esc(x.point)}<small>${x.have?'Already in locker: '+esc(x.matchedDocument):'Patient needs '+esc(x.category)} · ${esc(x.confidence)} confidence</small></div></div>`).join('')}</div>`}function channels(q){return `<div>${(q.deliveries||[]).map(d=>`<span class="channel ${d.status==='sent'?'':'fail'}">${esc(d.channel)} · ${esc(d.status)}${d.error?': '+esc(d.error):''}</span>`).join('')}</div>`}function queries(p){return `${p.queries.length?p.queries.map(q=>`<div class="query"><div class="file">QRY</div><div class="row"><b>${esc(q.name)}</b><small>${new Date(q.date).toLocaleString()} · ${q.points?.length||0} points · ${esc(q.status)}</small></div><a class="btn small" target="_blank" href="/api/patients/${encodeURIComponent(p.id)}/queries/${encodeURIComponent(q.id)}/letter">Text</a></div>${pts(q)}${q.message?`<div class="template">${esc(q.message)}</div>`:''}${channels(q)}`).join(''):'<div class="empty">No insurer query letters yet.</div>'}<button class="btn small" id="addquery" style="margin-top:9px">＋ Upload query letter</button>`}function msgs(p){return p.messages.length?p.messages.map(m=>`<div class="message"><div class="file">MSG</div><div class="row"><b>${esc(m.status)} · ${esc(m.queryName)}</b><small>${new Date(m.at).toLocaleString()}</small>${channels(m)}<div class="msg">${esc(m.message)}</div></div></div>`).join(''):'<div class="empty">No outbound messages recorded.</div>'}function checklist(p){return TYPES.slice(0,8).map(t=>{let d=p.documents.find(x=>x.category===t&&!x.needsReview);return `<div class="check"><span style="color:${d?'var(--green)':'#a2aea5'}">${d?'✓':'○'}</span>${esc(t)}<span style="margin-left:auto;color:var(--muted)">${d?esc(d.name):'Missing'}</span></div>`}).join('')}
function queryPage(){let all=S.patients.flatMap(p=>p.queries.filter(q=>!['Sent','Closed'].includes(q.status)).map(q=>({p,q})));return `<div class="head"><div><span class="eyebrow">Incoming work</span><h1>Query queue</h1><p>Insurer query points matched against existing patient documents.</p></div></div><div class="banner"><b>Automatic on upload.</b> The app reads query letters, identifies separate requests, checks the patient locker, prepares a template message, and attempts WhatsApp and email dispatch without a send click.</div><section class="card"><div class="cardhead"><div><h2>Open queries</h2><p>${all.length} query letters awaiting resolution</p></div></div>${all.length?all.map(({p,q})=>`<div class="queryline"><div class="query"><div class="file">QRY</div><div class="row"><b>${esc(q.name)}</b><small>${esc(p.name)} · ${esc(p.id)}</small></div><span class="status">${esc(q.status)}</span></div>${pts(q)}${channels(q)}<div style="text-align:right;margin-top:7px"><button class="btn small" data-open="${esc(p.id)}">Open patient</button></div></div>`).join(''):'<div class="empty">No open queries.</div>'}</section>`}function messagePage(){let all=S.patients.flatMap(p=>p.messages.map(m=>({p,m}))).sort((a,b)=>b.m.at.localeCompare(a.m.at));return `<div class="head"><div><span class="eyebrow">Communication log</span><h1>Message history</h1><p>Delivery status, provider responses and patient message content.</p></div><button class="btn" id="csv">↓ Export CSV</button></div><section class="card"><div class="cardhead"><div><h2>Outbound records</h2><p>${all.length} attempts</p></div></div>${all.length?all.map(({p,m})=>`<div class="queryline"><b>${esc(p.name)} · ${esc(p.id)}</b><div class="psub">${esc(m.queryName)} · ${new Date(m.at).toLocaleString()}</div>${channels({deliveries:m.channels})}<div class="template">${esc(m.message)}</div></div>`).join(''):'<div class="empty">No delivery attempts yet.</div>'}</section>`}function settingsPage(){return `<div class="head"><div><span class="eyebrow">Provider setup</span><h1>Delivery status</h1><p>Provider credentials are held by the server and never exposed in the browser.</p></div></div><div class="banner"><b>WhatsApp business initiated messages need an approved template.</b> Set the template name and language to match your Meta account. Query upload automatically tries both configured channels and records provider status.</div><section class="card"><div class="cardhead"><div><h2>WhatsApp Cloud API</h2><p>WA_PHONE_ID · WA_ACCESS_TOKEN · WA_TEMPLATE_NAME</p></div><span class="status ${S.integrations.whatsapp?'ok':''}">${S.integrations.whatsapp?'Ready':'Setup needed'}</span></div><div class="body">Set these variables in the server's <code>.env</code>. The approved template must contain four body parameters: patient name, insurer, patient ID and requested items.</div></section><section class="card" style="margin-top:12px"><div class="cardhead"><div><h2>Email via Resend</h2><p>RESEND_API_KEY · EMAIL_FROM (verified sender)</p></div><span class="status ${S.integrations.email?'ok':''}">${S.integrations.email?'Ready':'Setup needed'}</span></div><div class="body">Set these variables in the server's <code>.env</code>. Provider credentials stay server-side.</div></section><section class="card" style="margin-top:12px"><div class="cardhead"><div><h2>Document processing</h2><p>Text extraction and OCR</p></div><span class="status ok">Enabled</span></div><div class="body">Text PDFs are parsed directly; scanned PDFs and images use OCR. Documents are categorized from filename and extracted content. If a document appears to name another patient, it is flagged and not used to satisfy a query.</div></section>`}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{S.page=b.dataset.page;render()});document.querySelectorAll('[data-pid]').forEach(b=>b.onclick=()=>{S.selected=b.dataset.pid;S.tab='documents';render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{S.selected=b.dataset.open;S.page='patients';S.tab='queries';render()});$('#search')?.addEventListener('input',e=>{S.search=e.target.value;let n=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(n,n)});$('#filter')?.addEventListener('change',e=>{S.filter=e.target.value;render()});$('#new')?.addEventListener('click',newPatient);$('#editpatient')?.addEventListener('click',editPatient);$('#adddoc')?.addEventListener('click',()=>fileModal('doc'));$('#addquery')?.addEventListener('click',()=>fileModal('query'));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteDoc(b.dataset.del));$('#export')?.addEventListener('click',()=>downloadFile('claimcare-patients.json',JSON.stringify(S.patients,null,2),'application/json'));$('#csv')?.addEventListener('click',csv);$('#logout')?.addEventListener('click',logout)}function editPatient(){const p=pnow();openModal("Update patient and delivery details",`<div class="field"><label>Full name</label><input id="editname" value="${esc(p.name)}"></div><div class="two"><div class="field"><label>WhatsApp phone</label><input id="editphone" value="${esc(p.phone)}"></div><div class="field"><label>Email</label><input id="editemail" type="email" value="${esc(p.email)}"></div></div><div class="field"><label>Insurer</label><input id="editinsurer" value="${esc(p.insurer)}"></div><div class="banner">Use the patient’s real, consented contact details before enabling automatic delivery.</div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="savepatient">Save details</button>`);$('#savepatient').onclick=async()=>{try{await api("/api/patients/"+encodeURIComponent(p.id),{method:"PATCH",body:JSON.stringify({name:$('#editname').value.trim(),phone:$('#editphone').value.trim(),email:$('#editemail').value.trim(),insurer:$('#editinsurer').value.trim()})});closeModal();await refresh();toast("Patient details updated")}catch(e){toast(e.message)}}}function newPatient(){openModal('Create patient locker',`<div class="two"><div class="field"><label>Patient ID *</label><input id="id" placeholder="CC-28601"></div><div class="field"><label>Full name *</label><input id="name"></div></div><div class="two"><div class="field"><label>Phone *</label><input id="phone" placeholder="+91 9XXXXXXXXX"></div><div class="field"><label>Email *</label><input id="email" type="email"></div></div><div class="two"><div class="field"><label>Age</label><input id="age" type="number"></div><div class="field"><label>City</label><input id="city"></div></div><div class="two"><div class="field"><label>Claim type</label><input id="claim" placeholder="Reimbursement"></div><div class="field"><label>Insurer</label><input id="insurer"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="create">Create locker</button>`);$('#create').onclick=async()=>{let v=x=>$('#'+x).value.trim();try{let d=await api('/api/patients',{method:'POST',body:JSON.stringify({id:v('id'),name:v('name'),phone:v('phone'),email:v('email'),age:v('age'),city:v('city'),claim:v('claim'),insurer:v('insurer')})});S.selected=d.patient.id;closeModal();await refresh();toast('Patient locker created')}catch(e){toast(e.message)}}}function fileModal(kind){let p=pnow();if(!p)return;openModal(kind==='query'?'Upload insurer query letter':'Add patient document',`<div class="field"><label>Choose file · PDF, image or text file</label><input id="file" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,.tiff,.tif,.txt,.md,.csv" required></div>${kind==='doc'?`<div class="field"><label>Category (auto-detected if left blank)</label><select id="category"><option value="">Auto-detect</option>${TYPES.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div class="field"><label>Display name (optional)</label><input id="docname"></div>`:''}<div id="state" style="font-size:10px;color:var(--muted)"></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="submit">${kind==='query'?'Upload & send automatically':'Add to locker'}</button>`);$('#submit').onclick=async()=>{let f=$('#file').files[0];if(!f)return toast('Choose a file first');let fd=new FormData();fd.append('file',f);if(kind==='doc'){fd.append('category',$('#category').value);fd.append('name',$('#docname').value)}$('#state').textContent=kind==='query'?'Extracting text, identifying points and attempting both message channels…':'Extracting text and classifying document…';$('#submit').disabled=true;try{let url=`/api/patients/${encodeURIComponent(p.id)}/${kind==='query'?'queries':'documents'}`;let d=await api(url,{method:'POST',body:fd});await refresh();S.selected=p.id;if(kind==='query')S.tab='queries';render();closeModal();toast(kind==='query'?`Processed · ${d.query.deliveries.map(x=>x.channel+': '+x.status).join(' · ')}`:d.warning||'Document added to locker')}catch(e){$('#state').textContent=e.message;$('#submit').disabled=false}}}async function deleteDoc(id){if(!confirm('Remove this document?'))return;try{await api(`/api/patients/${encodeURIComponent(S.selected)}/documents/${encodeURIComponent(id)}`,{method:'DELETE'});await refresh();toast('Document removed')}catch(e){toast(e.message)}}function downloadFile(n,t,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function csv(){let x=S.patients.flatMap(p=>p.messages.map(m=>[p.id,p.name,m.queryName,m.at,m.status,m.channels.map(c=>c.channel+': '+c.status).join('; ')]));downloadFile('claimcare-message-history.csv','Patient ID,Patient,Query,Date,Status,Channels\n'+x.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')}async function logout(){await api('/api/logout',{method:'POST'}).catch(()=>{});showLogin()}init();
</script><script>
function docs(p){return `${p.documents.length?p.documents.map(d=>`<div class="doc"><div class="file">${d.mime?.includes('pdf')?'PDF':'DOC'}</div><div class="row"><b>${esc(d.name)}</b><small>${esc(d.category)} · ${new Date(d.date).toLocaleDateString()} · ${Math.ceil((d.size||0)/1024)} KB</small>${d.needsReview?`<small style="color:var(--red)">⚠ ${esc(d.reviewReason)}</small>`:''}</div><div class="rowbuttons">${d.file?`<a class="btn small" href="/api/files/${encodeURIComponent(d.file)}" target="_blank">↓</a>`:'<span class="channel">sample</span>'}<button class="btn small" data-del="${esc(d.id)}">×</button></div></div>`).join(''):'<div class="empty">No documents stored.</div>'}<button class="btn small" id="adddoc" style="margin-top:9px">＋ Add document</button>`}
function queries(p){return `${p.queries.length?p.queries.map(q=>`<div class="query"><div class="file">QRY</div><div class="row"><b>${esc(q.name)}</b><small>${new Date(q.date).toLocaleString()} · ${q.points?.length||0} points · ${esc(q.status)}</small></div>${q.file?`<a class="btn small" target="_blank" href="/api/query-files/${encodeURIComponent(q.file)}">Letter</a>`:`<span class="btn small">Sample</span>`}<a class="btn small" target="_blank" href="/api/patients/${encodeURIComponent(p.id)}/queries/${encodeURIComponent(q.id)}/letter">Text</a></div>${pts(q)}${q.message?`<div class="template">${esc(q.message)}</div>`:''}${channels(q)}`).join(''):'<div class="empty">No insurer query letters yet.</div>'}<button class="btn small" id="addquery" style="margin-top:9px">＋ Upload query letter</button>`}
</script></body></html>
